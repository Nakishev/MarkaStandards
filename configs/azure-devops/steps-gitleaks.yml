steps:
  - bash: |
      set -euo pipefail
      version=8.30.1
      asset=gitleaks_8.30.1_linux_x64.tar.gz
      base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
      cd "$(Agent.TempDirectory)"
      curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o "gitleaks_${version}_checksums.txt"
      curl -fsSL "$base/$asset" -o "$asset"
      grep "  $asset$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
      tar -xzf "$asset" -C "$(Agent.TempDirectory)"
      "$(Agent.TempDirectory)/gitleaks" git --no-banner --redact --exit-code 1 "$(Build.SourcesDirectory)"
    displayName: Secret scan (Gitleaks v8.30.1)
