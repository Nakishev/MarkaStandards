[project]
name = "my-service"
version = "0.1.0"
description = "One-line description of the service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "ty>=0.0.1",
    "pip-audit>=2.7",
]

# ── Ruff: formatter + linter ────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "S",        # bandit (security)
]
ignore = [
    "S101",     # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.ruff.lint.isort]
force-single-line = true

# ── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires Docker/Testcontainers or external services",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.ty]
# ty is the default type checker for this template.
